name: Continuous Integration (JWT Authority)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build Verification & Unit Tests
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the clean Python source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up native Python 3.12 runner environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # 3. Install your newly pinned requirements to verify no conflicts
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # If you have unit tests written, uncomment below:
        # pip install pytest && pytest

    # 4. Verify that the new cloud-agnostic Dockerfile builds successfully
    - name: Test Local Docker Build
      run: |
        docker build -t flagship-jwt-authority:test .