name: Continuous Integration (JWT Authority)

on:
  # 1. Developer Inner Loop: Protect main from broken PR code
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  # 2. Continuous Deployment Gate: Only build images after code is committed to main
  push:
    branches:
      - main

jobs:
  # --- STAGE 1: VERIFICATION GATE (Runs on BOTH PRs and Merge to Main) ---
  validate:
    name: Build Verification & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Standalone Unit Tests
      run: |
        python -m pytest -v

  # --- STAGE 2: PACKAGING GATE (Runs ONLY after a successful merge to Main) ---
  package:
    name: Build & Publish Production Container
    runs-on: ubuntu-latest
    needs: validate  # Absolute rule: Never package an application if tests fail
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Test & Verify Cloud-Agnostic Production Build
      run: |
        docker build -t headsntails-jwt-authority:latest .